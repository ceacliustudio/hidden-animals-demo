<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hidden Animals</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14241a; touch-action: none; }
#game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#unity-canvas { display: block; width: 100%; height: 100%; background: #14241a; outline: none; }
#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; font: 600 18px system-ui, sans-serif; gap: 16px; background: #14241a; }
#bar { width: 220px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); overflow: hidden; }
#fill { width: 0; height: 100%; background: #f9c234; transition: width .2s; }
</style>
</head>
<body>
<div id="game"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="loading"><div>Hidden Animals</div><div id="bar"><div id="fill"></div></div></div>
<script>
  var canvas = document.getElementById("unity-canvas");
  var config = {
    dataUrl: "Build/WebGL.data",
    frameworkUrl: "Build/WebGL.framework.js",
    codeUrl: "Build/WebGL.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Ceacliu Studios",
    productName: "Hidden Animals",
    productVersion: "1.0.0",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
  };
  var script = document.createElement("script");
  script.src = "Build/WebGL.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      document.getElementById("fill").style.width = (p * 100) + "%";
    }).then(function () {
      document.getElementById("loading").style.display = "none";
      canvas.focus();
    }).catch(function (message) { alert(message); });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
